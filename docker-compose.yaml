services:

  db:
     image: mysql:8.4.0
     container_name: mySqlContainer
     ports:
       - ${DB_PORT}:3306 # Host port can be modified, container is always 3306
     environment:
       - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
       - MYSQL_DATABASE=${DB_NAME}
     volumes:
       - ~/Documents/DEV/dbfiles:/var/lib/mysql 
